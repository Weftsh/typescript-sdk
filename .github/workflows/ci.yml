name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The built package loads under both module systems
        run: |
          node -e "const { Weft } = require('./dist/index.cjs'); if (typeof Weft !== 'function') process.exit(1)"
          node --input-type=module -e "import { Weft } from './dist/index.js'; if (typeof Weft !== 'function') process.exit(1)"
